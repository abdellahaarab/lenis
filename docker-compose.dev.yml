name: alarbi-mysql-dev
services:
  mysql:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alarbi}
      MYSQL_USER: ${MYSQL_USER:-alarbi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run env:init}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run env:init}
    ports: ["127.0.0.1:${MYSQL_PORT:-3306}:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
