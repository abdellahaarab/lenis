name: alarbi-mysql-test
services:
  mysql:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_PASSWORD:?Set a random TEST_MYSQL_PASSWORD}
    ports: ["127.0.0.1:53308:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 2s
      retries: 20
